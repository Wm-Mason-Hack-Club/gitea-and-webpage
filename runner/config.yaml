# act_runner configuration (Gitea Actions).
# Full reference: `docker run --rm gitea/act_runner:0.6 generate-config`

log:
  level: info

runner:
  # Registration state; lives in ./data/runner (mounted at /data).
  file: .runner
  # How many jobs may run at once. Raise if the server has spare CPU/RAM.
  capacity: 2
  timeout: 1h
  fetch_timeout: 5s
  fetch_interval: 2s
  # `runs-on:` label -> container image used for the job.
  labels:
    - "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest"
    - "ubuntu-24.04:docker://gitea/runner-images:ubuntu-24.04"
    - "ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04"

cache:
  # actions/cache support, served by the runner itself.
  enabled: true
  dir: /data/cache

container:
  # Fresh network per job so jobs can't see each other. Keep this empty:
  # jobs on dind's default "bridge" network can't resolve DNS.
  network: ""
  privileged: false
  # Per-job resource caps, so one runaway (or crypto-mining...) job can't starve the box.
  options: "--memory=2g --cpus=2 --pids-limit=1024"
  # Jobs may not mount any volumes.
  valid_volumes: []
  # Don't hand the Docker socket to job containers.
  docker_host: "-"
  force_pull: false

host:
  workdir_parent:
