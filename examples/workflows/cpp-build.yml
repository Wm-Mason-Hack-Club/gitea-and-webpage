# Example: compile a C/C++ project and run its test binary.
# Assumes a Makefile with `all` and `test` targets.
name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: make all
      - run: make test
