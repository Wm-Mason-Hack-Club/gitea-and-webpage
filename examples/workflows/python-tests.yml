# Example: run pytest on every push. Copy to .gitea/workflows/test.yml in a
# student repo that has a requirements.txt and tests/.
name: Tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v
